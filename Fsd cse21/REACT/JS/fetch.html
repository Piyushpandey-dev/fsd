<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
    <style>
        #box{
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: pink;
        }
        #table{
            width: 100%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: rgb(0, 0, 0);
            border: 2px solid rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <div id="box">
        <table id="table">
            <thead>
                <tr>
                    <th> so.no</th>
                    <th>Title</th>
                    <th>Images</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>    
            </thead>
            <tbody id="data">

            </tbody>
        </table>
    </div>
    <script >
        const ele = document.getElementById("data");
        const url = "https://dummyjson.com/products"
        async function loadProduct() {
            try{
                const res = await fetch(url);
                const data = await res.json();
                console.log("data",data.products);
                let row ="";
                data.products.map((i,index)=>{
                    row += `
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.thumbnail}" ></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                        
                    </tr>
                    `;
                    
                });

                ele.innerHTML = row;
            }
            catch(err){
                console.log("lele error",err);
            }
        }

        loadProduct();
    </script>
</body>
</html>
